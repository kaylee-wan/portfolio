document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

klch(0 0 0 / 0.08);\">\n    <div style=\"font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.02em;\">Kaylee (Li) Wan<\u002Fdiv>\n    <div style=\"display: flex; gap: 36px; font-size: 14px; font-weight: 500;\">\n      <a href=\"#about\" style=\"color: oklch(0.35 0.006 260)\">About<\u002Fa>\n      <a href=\"#projects\" style=\"color: oklch(0.35 0.006 260)\">Projects<\u002Fa>\n      <a href=\"#experience\" style=\"color: oklch(0.35 0.006 260)\">Experience<\u002Fa>\n      <a href=\"#resume\" style=\"color: oklch(0.35 0.006 260)\">Resume<\u002Fa>\n      <a href=\"#contact\" style=\"color: oklch(0.35 0.006 260)\">Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  \n\n  <!-- ABOUT -->\n  <section id=\"hero\" style=\"min-height: 68vh; display: grid; grid-template-columns: 1.3fr 380px; align-items: center; gap: 48px; padding: 0 64px; max-width: 1200px; margin: 0 auto;\">\n    <div>\n      <div style=\"font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 20px; animation: fadeUp 0.6s ease both;\">Data Analyst · Operations · AI &amp; Automation<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 24px; animation: fadeUp 0.6s ease 0.1s both;\">\n        <h1 style=\"font-family: 'Manrope', sans-serif; font-size: 55px; font-weight: 800; line-height: 1.05; margin: 0; letter-spacing: -0.02em\">Hi, I'm Li<\u002Fh1><span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; color: oklch(0.4 0.1 150); background: oklch(0.94 0.03 150); border: 1px solid oklch(0.8 0.06 150); border-radius: 20px; padding: 8px 16px; align-self: flex-start; margin-top: 2px; justify-content: flex-start; flex-direction: row\">🟢 Open to Work<\u002Fspan>\n        \n      <\u002Fdiv>\n      <p style=\"font-size: 22px; line-height: 1.55; color: oklch(0.4 0.006 260); max-width: 680px; margin: 0 0 40px; animation: fadeUp 0.6s ease 0.2s both;\">I turn messy data into decisions — building ETL pipelines, statistical models, and AI agents that give teams clarity and save them hours of manual work.<\u002Fp>\n      <div style=\"display: flex; gap: 16px; animation: fadeUp 0.6s ease 0.3s both;\">\n        <a href=\"#projects\" style=\"display: inline-flex; align-items: center; padding: 18px 36px; background: oklch(0.5 0.13 55); color: oklch(1 0 0); font-weight: 600; font-size: 18px; border-radius: 6px\">View Projects<\u002Fa>\n        <a href=\"#resume\" style=\"display: inline-flex; align-items: center; padding: 18px 36px; border: 1px solid oklch(0 0 0 / 0.15); color: oklch(0.22 0.006 260); font-weight: 600; font-size: 18px; border-radius: 6px\">Resume<\u002Fa><a href=\"#contact\" style=\"display: inline-flex; align-items: center; padding: 18px 36px; border: 1px solid oklch(0 0 0 / 0.15); color: oklch(0.22 0.006 260); font-weight: 600; font-size: 18px; border-radius: 6px\">Get in Touch<\u002Fa>\n        \n      <\u002Fdiv>\n    <\u002Fdiv><image-slot id=\"headshot\" style=\"width: 340px; height: 340px;\" shape=\"rounded\" radius=\"20\" placeholder=\"Drop headshot\" src=\"f449b808-20a7-4674-aaa7-8e5146c5aae0\"><\u002Fimage-slot>\n    \n  <\u002Fsection><section id=\"about\" style=\"padding: 40px 64px 40px; max-width: 1100px; margin: 0 auto;\">\n    <div style=\"font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 16px;\">About<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items: start;\">\n      <p style=\"font-size: 20px; line-height: 1.7; color: oklch(0.32 0.006 260); margin: 0;\">Data-driven UC Berkeley Data Science graduate (GPA: 3.83) with expertise in Excel, SQL, Python, ETL pipelines, and AI workflow automation. Designed and shipped Al agents, dashboards, and statistical analysis pipelines that transformed raw data into executive-ready insights across healthcare, e-commerce, and research. Track record of leading cross-functional collaboration, operational transformation, and delivering measurable business impact.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 20px; background: oklch(1 0 0); border: 1px solid oklch(0 0 0 / 0.08); border-radius: 12px; padding: 28px; width: 360px;\">\n        <div>\n          <div style=\"font-size: 13px; color: oklch(0.55 0.006 260); margin-bottom: 4px;\">Education<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600;\">UC Berkeley — B.A. Data Science<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.45 0.006 260);\">Business Analytics focus · GPA 3.83/4.0 · Dec 2025<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13px; color: oklch(0.55 0.006 260); margin-bottom: 4px;\">Recognition<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.32 0.006 260); line-height: 1.5;\">Jack Kent Cooke Scholar (Top 6.5% Nationwide)<br>Western Union Global Scholar (Top 40 Globally)<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13px; color: oklch(0.55 0.006 260); margin-bottom: 4px;\">Skills<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.32 0.006 260); line-height: 1.5;\">Python, SQL, Microsoft Excel Expert (MO-211 Certified), Google Sheets, Tableau, Power BI, SPSS, Claude Code, Codex, Gemini, n8n<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13px; color: oklch(0.55 0.006 260); margin-bottom: 4px;\">Interests<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.32 0.006 260); line-height: 1.5;\">Design &amp; Sketching, Virtual Reality (VR) Games, Photography, Mentoring, Learning New Tools<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROJECTS -->\n  <section id=\"projects\" style=\"padding: 0px 64px 100px; max-width: 1200px; margin: 0 auto;\">\n    <div style=\"font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 16px;\">Projects<\u002Fdiv>\n    <h2 style=\"font-family: 'Manrope', sans-serif; font-size: 40px; font-weight: 800; margin: 0 0 56px; letter-spacing: -0.01em;\">Selected work<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;\">\n      <sc-for list=\"{{ projects }}\" as=\"proj\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; flex-direction: column; background: oklch(1 0 0); border: 1px solid oklch(0 0 0 / 0.08); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px oklch(0 0 0 / 0.04);\">\n          <div style=\"position: relative;\">\n            <image-slot id=\"{{ proj.slotId }}\" style=\"width: 100%; height: 200px;\" shape=\"rect\" placeholder=\"{{ proj.placeholder }}\"><\u002Fimage-slot>\n            <sc-if value=\"{{ proj.logo }}\" hint-placeholder-val=\"{{ false }}\">\n              <img src=\"{{ proj.logo }}\" style=\"position: absolute; left: 16px; bottom: -2px; height: 64px; width: auto; pointer-events: none;\" alt=\"\">\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px;\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.5 0.13 55);\">{{ proj.category }}<\u002Fdiv>\n            <div style=\"font-family: 'Manrope', sans-serif; font-size: 20px; font-weight: 700;\">{{ proj.title }}<\u002Fdiv>\n            <div style=\"font-size: 13px; color: oklch(0.5 0.006 260);\">{{ proj.org }}<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;\">\n              <sc-for list=\"{{ proj.tags }}\" as=\"tag\" hint-placeholder-count=\"3\">\n                <span style=\"font-size: 12px; padding: 5px 10px; background: oklch(0.95 0.006 90); border-radius: 5px; color: oklch(0.45 0.006 260);\">{{ tag }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EXPERIENCE -->\n  <section id=\"experience\" style=\"padding: 100px 64px; background: oklch(0.95 0.006 90); border-top: 1px solid oklch(0 0 0 / 0.06); border-bottom: 1px solid oklch(0 0 0 / 0.06);\">\n    <div style=\"max-width: 900px; margin: 0 auto;\">\n      <div style=\"font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 40px;\">Experience<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <sc-for list=\"{{ experience }}\" as=\"job\" hint-placeholder-count=\"4\">\n          <div style=\"display: grid; grid-template-columns: 200px 1fr; gap: 32px; padding: 24px 0; border-top: 1px solid oklch(0 0 0 / 0.08);\">\n            <div style=\"font-size: 13px; color: oklch(0.5 0.006 260); padding-top: 2px;\">{{ job.dates }}<\u002Fdiv>\n            <div>\n              <div style=\"font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 2px;\">{{ job.role }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: oklch(0.5 0.13 55); margin-bottom: 10px;\">{{ job.org }}<\u002Fdiv>\n              <ul style=\"margin: 0; padding-left: 18px; font-size: 14.5px; line-height: 1.6; color: oklch(0.35 0.006 260); display: flex; flex-direction: column; gap: 6px;\">\n                <sc-for list=\"{{ job.bullets }}\" as=\"pt\" hint-placeholder-count=\"3\">\n                  <li>{{ pt }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RESUME -->\n  <section id=\"resume\" style=\"padding: 100px 64px; max-width: 900px; margin: 0 auto;\">\n    <div style=\"font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 16px;\">Resume<\u002Fdiv>\n    <h2 style=\"font-family: 'Manrope', sans-serif; font-size: 40px; font-weight: 800; margin: 0 0 32px; letter-spacing: -0.01em;\">Professional Resume<\u002Fh2>\n    <div style=\"display: flex; align-items: center; justify-content: space-between; background: oklch(1 0 0); border: 1px solid oklch(0 0 0 / 0.08); border-radius: 12px 12px 0 0; padding: 12px 20px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px;\">\n        <button sc-camel-on-click=\"{{ zoomOut }}\" style=\"width: 32px; height: 32px; border-radius: 6px; border: 1px solid oklch(0 0 0 / 0.15); background: oklch(0.98 0.004 90); font-size: 16px; font-weight: 700; cursor: pointer;\">−<\u002Fbutton>\n        <span style=\"font-size: 13px; color: oklch(0.4 0.006 260); min-width: 42px; text-align: center;\">{{ zoomPercent }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ zoomIn }}\" style=\"width: 32px; height: 32px; border-radius: 6px; border: 1px solid oklch(0 0 0 / 0.15); background: oklch(0.98 0.004 90); font-size: 16px; font-weight: 700; cursor: pointer;\">+<\u002Fbutton>\n      <\u002Fdiv>\n      <a href=\"./assets/resume.pdf\" download=\"Kaylee-Wan-Resume.pdf\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: oklch(0.5 0.13 55); color: oklch(0.98 0.004 90); font-weight: 600; font-size: 14px; border-radius: 6px;\">⬇ Download<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.95 0.006 90); border: 1px solid oklch(0 0 0 / 0.08); border-top: none; border-radius: 0 0 12px 12px; padding: 32px; overflow: auto; max-height: 720px; display: flex; justify-content: center; width: 841px; height: 792px\">\n      <div style=\"width: {{ zoomWidth }}; flex-shrink: 0; transition: width 0.15s ease; aspect-ratio: 8.5 / 11; background: oklch(1 0 0); box-shadow: 0 1px 6px oklch(0 0 0 / 0.1);\">\n        <embed src=\"./assets/resume.pdf#toolbar=0\" type=\"application/pdf\" style=\"width: 100%; height: 100%; border: none; display: block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" style=\"padding: 120px 64px; max-width: 800px; margin: 0 auto; text-align: center;\">\n    <div style=\"font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.5 0.13 55); margin-bottom: 16px;\">Contact<\u002Fdiv>\n    <h2 style=\"font-family: 'Manrope', sans-serif; font-size: 44px; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.01em;\">Let's work together<\u002Fh2>\n    <p style=\"font-size: 18px; line-height: 1.6; color: oklch(0.35 0.006 260); margin: 0 0 40px;\">Open to Data Analyst, Operations Analyst, and AI &amp; Automation roles. Based in San Francisco, CA — happy to chat remote or on-site.<\u002Fp>\n    <div style=\"display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 48px;\">\n      <a href=\"mailto:liwan@berkeley.edu\" style=\"display: inline-flex; align-items: center; padding: 14px 28px; background: oklch(0.5 0.13 55); color: oklch(0.98 0.004 90); font-weight: 600; font-size: 15px; border-radius: 6px;\">liwan@berkeley.edu<\u002Fa>\n      <a href=\"#\" style=\"display: inline-flex; align-items: center; padding: 14px 28px; border: 1px solid oklch(0 0 0 / 0.15); color: oklch(0.22 0.006 260); font-weight: 600; font-size: 15px; border-radius: 6px;\">Download Resume<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; justify-content: center; gap: 28px; font-size: 15px; color: oklch(0.45 0.006 260);\">\n      <a href=\"https://linkedin.com/in/kayleewan\" target=\"_blank\">linkedin.com/in/kayleewan<\u002Fa>\n      <span style=\"color: oklch(0.7 0.006 260);\">·<\u002Fspan>\n      <span>+1 (503) 317-7693<\u002Fspan>\n      <span style=\"color: oklch(0.7 0.006 260);\">·<\u002Fspan>\n      <span>San Francisco, CA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding: 32px 64px; text-align: center; font-size: 13px; color: oklch(0.55 0.006 260); border-top: 1px solid oklch(0 0 0 / 0.08);\">© 2026 Kaylee Wan<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { zoom: 1.4, resumeUrl: localStorage.getItem('kw-resume-pdf') || './assets/resume.pdf' };\n  onUploadPdf = (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      try { localStorage.setItem('kw-resume-pdf', reader.result); } catch (err) {}\n      this.setState({ resumeUrl: reader.result });\n    };\n    reader.readAsDataURL(file);\n  };\n  renderVals() {\n    const zoom = this.state.zoom;\n    return {\n      resumeUrl: this.state.resumeUrl,\n      onUploadPdf: this.onUploadPdf,\n      zoomPercent: Math.round(zoom * 100) + '%',\n      zoomWidth: (600 * zoom) + 'px',\n      zoomIn: () => this.setState(s => ({ zoom: Math.min(2, +(s.zoom + 0.1).toFixed(2)) })),\n      zoomOut: () => this.setState(s => ({ zoom: Math.max(0.5, +(s.zoom - 0.1).toFixed(2)) })),\n      skillGroups: [\n        { title: 'Languages & Tools', items: ['Python', 'SQL', 'Microsoft Excel Expert (MO-211 Certified)', 'Google Sheets', 'Tableau', 'Power BI', 'SPSS'] },\n        { title: 'AI & Automation', items: ['Claude Code', 'Codex', 'Gemini', 'n8n', 'Prompt Engineering', 'Multi-Agent Systems', 'Workflow Automation'] },\n        { title: 'Methods', items: ['ETL', 'Statistical Analysis', 'Root Cause Analysis', 'A/B Testing', 'Data Visualization', 'Stakeholder Communication'] }\n      ],\n      projects: [\n        {\n          category: 'Data Analysis',\n          slotId: 'proj-data',\n          placeholder: 'Data analysis project image',\n          title: 'SQL & Database Architecture',\n          org: 'Breaking Games (via Extern)',\n          logo: (window.__resources && window.__resources.breakingGamesLogo) || './assets/breaking-games-logo.webp',\n          tags: ['Database Design', 'SQL', 'Business Intelligence', 'E-Commerce Analytics', 'Marketing Attribution']\n        },\n        {\n          category: 'AI & Automation',\n          slotId: 'proj-ai',\n          placeholder: 'AI automation project image',\n          logo: (window.__resources && window.__resources.wayfairLogo) || './assets/wayfair-logo.png',\n          title: 'AI Agents for Market Intelligence',\n          org: 'Wayfair (via Extern)',\n          tags: ['n8n', 'OpenAI', 'Claude', 'Gemini', 'AI Agent Development', 'Dashboard Design', 'Trend Analysis', 'Prompt Engineering', 'Competitor Product Benchmarking']\n        },\n        {\n          category: 'Operations Analytics',\n          slotId: 'proj-ops',\n          placeholder: 'Operations analytics project image',\n          title: 'People Analytics & Attrition Root-Cause',\n          org: 'Amazon Fulfillment Center (via Extern)',\n          tags: ['Sentiment Analysis', 'People Operations', 'HR Strategy', 'Python Scraping', 'Workforce Data Analysis', 'Python', 'Excel', 'Claude AI', 'Root Cause Analysis', 'ETL']\n        }\n      ],\n      experience: [\n        { dates: 'Oct 2025 – Present', role: 'Research Data Analyst', org: 'UCSF, Neuroscape Research Lab', bullets: [\n          'Reduced data noise by 80% by engineering an ETL pipeline in Python on a 28K-row VR cognitive training dataset.',\n          'Identified data quality issues and communicated findings to the lab director, leading to a cross-functional investigation with data collection partners and revised analysis objectives.',\n          'Developed an interactive HTML analytics dashboard (Claude-assisted) enabling researchers to explore longitudinal participant progress, treatment groups, game performance, and study metrics.',\n          'Performed t-tests and ANCOVAs in SPSS to compare VR vs. tablet cognitive training outcomes across 158 participants.'\n        ] },\n        { dates: 'Jul 2026 – Aug 2026', role: 'AI Agent & Automation Extern', org: 'Wayfair (via Extern)', bullets: [\n          'Developed 5 end-to-end AI agents in n8n automating trend discovery, competitor benchmarking, and content generation for Wayfair\\u2019s Rugs category, replacing manual research workflows.',\n          'Built a multi-source data pipeline (Amazon, Walmart, Instagram, Pinterest, industry blogs) feeding LLM agents (OpenAI, Claude, Gemini) to detect emerging rug trends and quantify competitor pricing/assortment gaps.',\n          'Delivered a centralized Google Sheets market-intelligence dashboard consolidating trend, competitor, and content-strategy outputs into a single decision-support tool for category teams.'\n        ] },\n        { dates: 'May 2026 – Jul 2026', role: 'Operational Strategy & People Analytics Extern', org: 'Amazon Fulfillment Center (via Extern)', bullets: [\n          'Quantified 59% of reported departures within first year by analyzing 147 employee feedback entries (Glassdoor, YouTube) via Python and Claude AI through sentiment analysis and tenure segmentation.',\n          'Identified scheduling and physical exhaustion as primary attrition drivers through root-cause analysis; recommended improvements to injury reporting and productivity-safety metrics.'\n        ] },\n        { dates: 'Sep 2025 – Dec 2025', role: 'Data Analyst Intern', org: 'Appa Health', bullets: [\n          'Analyzed 2,100+ outreach records, surfaced key metrics including a 54% no-response rate, and modeled weekly contact targets to hit enrollment goals; delivered 4 presentations to CEO and Project Lead.',\n          'Audited the end-to-end sign-up flow and identified UX blockers reducing conversion; proposed a form redesign and A/B testing framework for mentor video variations to improve teen engagement.'\n        ] },\n        { dates: 'Oct 2021 – May 2023', role: 'Scheduling & Front Desk Operations Staff', org: 'Berkeley City College Learning Resource Center', bullets: [\n          'Managed end-to-end scheduling for 450+ appointments per semester; maintained a real-time Google Sheets tracker and SARS Anywhere session notes across three intake channels.',\n          'Generated 100+ new sign-ups via a 20-slide outreach deck, in-class presentations, and campus QR code deployment; analyzed demand to proactively expand tutor capacity ahead of peak periods.',\n          'Trained incoming staff on SARS Anywhere and Google Sheets workflows; maintained an equipment check-in/out log with timestamped records, student notes, and supporting documentation.'\n        ] }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
